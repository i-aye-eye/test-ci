# Copy to .github/workflows/gh200-tests.yml in your repo, and ci/gh200.sh beside it.
#
# Phase 1 (now): dispatch: manual. Start the runner from your laptop with
#   test-ci-runner's tools/dispatch-runner.sh --watch OWNER/REPO
# Phase A (dev): dispatch: mvp, with the two secrets, the BRICS_CI_URL variable and
#   id-token: write, so the CI service knows which repo, commit and run a job came from.
# Phase B2: dispatch: service, with the CI service's GitHub App installed and the repo
#   registered, and the BRICS_CI_SUBMITTER_URL variable. No secrets, no id-token.
name: GH200 tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # id-token: write                      # dispatch: mvp: send GitHub's token for the job

jobs:
  gh200:
    uses: i-aye-eye/test-ci/.github/workflows/gh200.yml@v0
    with:
      profile: gh200-1gpu
      script: ci/gh200.sh
      dispatch: manual
      # image: ubuntu:24.04                # run the script in a container instead
    # secrets:                             # dispatch: mvp only
    #   origin-token: ${{ secrets.BRICS_CI_ORIGIN_TOKEN }}
    #   runner-admin-pat: ${{ secrets.RUNNER_ADMIN_PAT }}

  # The same script, in a container image
  gh200-image:
    uses: i-aye-eye/test-ci/.github/workflows/gh200.yml@v0
    with:
      profile: gh200-1gpu
      script: ci/gh200.sh
      image: ubuntu:24.04
      dispatch: manual
