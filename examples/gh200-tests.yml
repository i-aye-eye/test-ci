# Copy to .github/workflows/gh200-tests.yml in your repo, and ci/gh200.sh beside it.
#
# dispatch: service: the CI service's GitHub App installed by your repo's organisation,
#   the repo registered with the CI service, and the BRICS_CI_SUBMITTER_URL variable.
#   No secrets, no id-token.
# dispatch: manual: start the runner from your laptop with test-ci-runner's
#   tools/dispatch-runner.sh --watch OWNER/REPO
# dispatch: mvp (a PAT and an origin token) is v0's.
name: GH200 tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gh200:
    uses: i-aye-eye/test-ci/.github/workflows/gh200.yml@v1
    with:
      profile: gh200-1gpu
      script: ci/gh200.sh
      dispatch: service
      # image: ubuntu:24.04                # run the script in a container instead

  # The same script, in a container image
  gh200-image:
    uses: i-aye-eye/test-ci/.github/workflows/gh200.yml@v1
    with:
      profile: gh200-1gpu
      script: ci/gh200.sh
      image: ubuntu:24.04
      dispatch: service
