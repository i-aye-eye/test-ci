# gh200.yml: the reusable workflow users call to run a script on Isambard-AI.
#
#   jobs:
#     gh200:
#       uses: i-aye-eye/test-ci/.github/workflows/gh200.yml@v0
#       with:
#         profile: gh200-1gpu
#         script: ci/gh200.sh
#         dispatch: mvp
#
# The GH200 job runs on a short-lived runner: one runner, in one Slurm job, for
# this one job, labelled test-ci-<profile> and test-ci-run-<run id>. What starts that
# runner depends on `dispatch` (see README.md).
#
# With dispatch: mvp or service, grant `id-token: write` in the calling workflow too:
# the request job then sends GitHub's OIDC token, so the CI service knows which repo,
# commit and run the job came from. Only the request job gets it: the GH200 job runs
# your code, so it's given `contents: read` alone.
name: gh200
on:
  workflow_call:
    inputs:
      profile:
        description: Resources on Isambard-AI, for example gh200-1gpu
        type: string
        required: true
      script:
        description: Path to the script in your repo, run from the repo's root
        type: string
        required: true
      args:
        description: Arguments for the script
        type: string
        default: ""
      image:
        description: Optional. Run the script in this container image with Apptainer, for example ubuntu:24.04
        type: string
        default: ""
      # Required, so a call without it fails at once. It used to default to manual,
      # where nothing starts a runner unless someone runs test-ci-runner's dispatcher,
      # so the job waited 24 hours and was cancelled
      dispatch:
        description: "Required. How the runner starts: manual (by hand), mvp (ci-service's release page), service (Phase B2, with the GitHub App) or automatic"
        type: string
        required: true
    secrets:
      origin-token:
        description: The repo's origin token for the CI service's job API (mvp, service)
        required: false
      runner-admin-pat:
        description: "A fine-grained PAT for the repo with Administration: write (mvp only, dev only)"
        required: false
    outputs:
      release-url:
        description: Where to release the run (mvp, service)
        value: ${{ jobs.request.outputs.release-url }}

jobs:
  # Runs on GitHub's own runner for a few seconds and asks the CI service for a runner.
  # Skipped for manual and automatic, and for pull requests from forks. Both jobs run
  # only on push, pull_request, workflow_dispatch and schedule, the job API's list: not
  # on events someone outside the repo can start, such as pull_request_target or
  # issue_comment. tests/check-events.sh keeps the two lists the same.
  request:
    if: >-
      (inputs.dispatch == 'mvp' || inputs.dispatch == 'service') &&
      contains(fromJSON('["push","pull_request","workflow_dispatch","schedule"]'), github.event_name) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-url: ${{ steps.request.outputs.release-url }}
      runner-id: ${{ steps.request.outputs.runner-id }}
    steps:
      - id: request
        uses: i-aye-eye/test-ci/request-runner@v0
        with:
          dispatch: ${{ inputs.dispatch }}
          profile: ${{ inputs.profile }}
          origin-token: ${{ secrets.origin-token }}
          runner-admin-pat: ${{ secrets.runner-admin-pat }}
          url: ${{ vars.BRICS_CI_URL }}

  # Waits in GitHub until its runner starts on Isambard-AI, then runs there.
  run:
    needs: request
    # Only what checkout needs. In particular no id-token: the job runs the caller's
    # code, which mustn't be able to get tokens for the CI service
    permissions:
      contents: read
    if: >-
      ${{ !cancelled() &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
          (needs.request.result == 'success' ||
           inputs.dispatch == 'manual' || inputs.dispatch == 'automatic') }}
    # automatic: the scale set's name only; otherwise the profile label plus the run label
    runs-on: >-
      ${{ fromJSON(inputs.dispatch == 'automatic'
          && format('["test-ci-{0}"]', inputs.profile)
          || format('["test-ci-{0}","test-ci-run-{1}"]', inputs.profile, github.run_id)) }}
    # from request-runner/profiles.json (job_minutes); tests/check-profiles.sh keeps them in step
    timeout-minutes: ${{ fromJSON('{"gh200-1gpu":50,"gh200-4gpu":110,"dev-cpu":20}')[inputs.profile] }}
    env:
      SCRIPT: ${{ inputs.script }}
      ARGS: ${{ inputs.args }}
      TEST_CI_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Run ${{ inputs.script }}
        if: inputs.image == ''
        run: |
          read -ra args <<< "$ARGS"
          bash "$SCRIPT" "${args[@]}"

      - name: Run ${{ inputs.script }} in ${{ inputs.image }}
        if: inputs.image != ''
        shell: test-ci-apptainer {0}   # on PATH in every test-ci runner; runs the step in TEST_CI_IMAGE
        run: |
          read -ra args <<< "$ARGS"
          bash "$SCRIPT" "${args[@]}"

  # Removes this job's runner from GitHub if no job used it: the job was never released,
  # the run was cancelled, or it timed out waiting. A runner that took its job has
  # removed itself already. A Slurm job that starts after this finds no registration
  # and stops at once. Never fails the run.
  cleanup:
    needs: [request, run]
    if: always() && needs.request.outputs.runner-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: i-aye-eye/test-ci/remove-runner@v0
        with:
          runner-admin-pat: ${{ secrets.runner-admin-pat }}
          runner-id: ${{ needs.request.outputs.runner-id }}
