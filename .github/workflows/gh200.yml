# gh200.yml: the reusable workflow users call to run a script on Isambard-AI.
#
#   jobs:
#     gh200:
#       uses: i-aye-eye/test-ci/.github/workflows/gh200.yml@v1
#       with:
#         profile: gh200-1gpu
#         script: ci/gh200.sh
#         dispatch: service
#
# The GH200 job runs on a short-lived runner: one runner, in one Slurm job, for
# this one job, labelled test-ci-<profile> and test-ci-run-<run id>. What starts that
# runner depends on `dispatch` (see README.md).
#
# v1 is for repos that use the CI service's GitHub App (dispatch: service): the App
# finds the run itself, so the request job only says where to release it. No secrets,
# and no id-token. dispatch: mvp, with a PAT and an origin token, is v0's.
name: gh200
on:
  workflow_call:
    inputs:
      profile:
        description: Resources on Isambard-AI, for example gh200-1gpu
        type: string
        required: true
      script:
        description: Path to the script in your repo, run from the repo's root
        type: string
        required: true
      args:
        description: Arguments for the script
        type: string
        default: ""
      image:
        description: Optional. Run the script in this container image with Apptainer, for example ubuntu:24.04
        type: string
        default: ""
      # Required, so a call without it fails at once. It used to default to manual,
      # where nothing starts a runner unless someone runs test-ci-runner's dispatcher,
      # so the job waited 24 hours and was cancelled
      dispatch:
        description: "Required. How the runner starts: service (released on the CI service, with its GitHub App), manual (by hand) or automatic. mvp is v0's"
        type: string
        required: true
    outputs:
      release-url:
        description: Where to release the run (service)
        value: ${{ jobs.request.outputs.release-url }}

jobs:
  # Runs on GitHub's own runner for a few seconds, and only writes where to release the
  # run to the run's summary, or stops a dispatch v1 doesn't have, such as mvp. Skipped
  # for manual and automatic, and for pull requests from forks. Both jobs run
  # only on push, pull_request, workflow_dispatch and schedule, the job API's list: not
  # on events someone outside the repo can start, such as pull_request_target or
  # issue_comment. tests/check-events.sh keeps the two lists the same.
  request:
    if: >-
      inputs.dispatch != 'manual' && inputs.dispatch != 'automatic' &&
      contains(fromJSON('["push","pull_request","workflow_dispatch","schedule"]'), github.event_name) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Needs no token: it only writes to the run's summary
    permissions: {}
    outputs:
      release-url: ${{ steps.link.outputs.release-url }}
    steps:
      - name: Check dispatch
        if: inputs.dispatch != 'service'
        env:
          DISPATCH: ${{ inputs.dispatch }}
        run: |
          echo "::error::dispatch: $DISPATCH isn't one of service, manual or automatic. mvp is v0's: call gh200.yml@v0 for it"
          exit 1

      # service: the CI service finds this run itself, with its GitHub App, and starts
      # the runner when someone releases the run. The link is to the run's page on the
      # submitter, from the BRICS_CI_SUBMITTER_URL variable. It's shown as code, not a
      # link: a link clicked on github.com wouldn't carry the submitter's login
      - id: link
        env:
          SUBMITTER: ${{ vars.BRICS_CI_SUBMITTER_URL }}
          PROFILE: ${{ inputs.profile }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ -n "$SUBMITTER" ]; then
            url="${SUBMITTER%/}/run?id=$RUN_ID&attempt=$RUN_ATTEMPT"
            echo "release-url=$url" >> "$GITHUB_OUTPUT"
            echo "Release this run at $url"
            where="Log in to the submitter, then copy this into your browser: \`$url\`"
          else
            echo "::notice::Set the BRICS_CI_SUBMITTER_URL variable in the repo to link to the release page here"
            where="It's under \"Runs to release\" on the CI service's submitter."
          fi
          {
            echo "### test-ci"
            echo "The $PROFILE job waits for someone in a BriCS project this repo is registered to, to release run $RUN_ID (attempt $RUN_ATTEMPT) on Isambard-AI."
            echo "$where"
            echo "GitHub cancels the job if no runner starts within 24 hours."
          } >> "$GITHUB_STEP_SUMMARY"

  # Waits in GitHub until its runner starts on Isambard-AI, then runs there.
  run:
    needs: request
    # Only what checkout needs. In particular no id-token: the job runs the caller's
    # code, which mustn't be able to get tokens for the CI service
    permissions:
      contents: read
    if: >-
      ${{ !cancelled() &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
          (needs.request.result == 'success' ||
           inputs.dispatch == 'manual' || inputs.dispatch == 'automatic') }}
    # automatic: the scale set's name only; otherwise the profile label plus the run label
    runs-on: >-
      ${{ fromJSON(inputs.dispatch == 'automatic'
          && format('["test-ci-{0}"]', inputs.profile)
          || format('["test-ci-{0}","test-ci-run-{1}"]', inputs.profile, github.run_id)) }}
    # from request-runner/profiles.json (job_minutes); tests/check-profiles.sh keeps them in step
    timeout-minutes: ${{ fromJSON('{"gh200-1gpu":50,"gh200-4gpu":110,"dev-cpu":20}')[inputs.profile] }}
    env:
      SCRIPT: ${{ inputs.script }}
      ARGS: ${{ inputs.args }}
      TEST_CI_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Run ${{ inputs.script }}
        if: inputs.image == ''
        run: |
          read -ra args <<< "$ARGS"
          bash "$SCRIPT" "${args[@]}"

      - name: Run ${{ inputs.script }} in ${{ inputs.image }}
        if: inputs.image != ''
        shell: test-ci-apptainer {0}   # on PATH in every test-ci runner; runs the step in TEST_CI_IMAGE
        run: |
          read -ra args <<< "$ARGS"
          bash "$SCRIPT" "${args[@]}"
