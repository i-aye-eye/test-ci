name: test-ci request runner
description: >-
  Asks the CI service to start a runner on Isambard-AI for this run's GH200 job. 
  Runs on GitHub's own runner, in gh200.yml's request job, or in your own workflow (the advanced form).
inputs:
  dispatch:
    description: "mvp (dev, Phase A) or service (Phase B)"
    required: true
  profile:
    description: Resources on Isambard-AI, for example gh200-1gpu
    required: true
  origin-token:
    description: The repo's origin token for the CI service's job API
    required: true
  runner-admin-pat:
    description: "dispatch: mvp only. A fine-grained PAT for this repo with Administration: write"
    required: false
    default: ""
  url:
    description: The CI service's job API (ci-service), for example vars.BRICS_CI_URL
    required: true
  launcher:
    description: >-
      Where test-ci-runner's launch-runner.sh lives on the cluster. Default: the
      profile's launcher in profiles.json, else /opt/test-ci-runner/launcher/launch-runner.sh
      (the dev stack's)
    required: false
    default: ""
  audience:
    description: The audience for GitHub's OIDC token, sent if the workflow grants id-token write
    required: false
    default: isambard-ci
outputs:
  release-url:
    description: Where to release this run
    value: ${{ steps.request.outputs.release-url }}
  runner-id:
    description: The runner made for this request, for gh200.yml's cleanup job to remove if no job used it
    value: ${{ steps.request.outputs.runner-id }}
runs:
  using: composite
  steps:
    - id: request
      shell: bash
      env:
        DISPATCH: ${{ inputs.dispatch }}
        PROFILE: ${{ inputs.profile }}
        ORIGIN_TOKEN: ${{ inputs.origin-token }}
        GH_TOKEN: ${{ inputs.runner-admin-pat }}
        URL: ${{ inputs.url }}
        LAUNCHER: ${{ inputs.launcher }}
        AUDIENCE: ${{ inputs.audience }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: '"$GITHUB_ACTION_PATH/request.sh"'
