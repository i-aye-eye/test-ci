name: Remove an unused test-ci runner
description: >-
  Removes the runner request-runner made for a job, if no job used it. Run it after the
  job, whatever happened to it. Never fails.
inputs:
  runner-admin-pat:
    description: The same PAT request-runner made the runner with
    required: true
  runner-id:
    description: request-runner's runner-id output
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.runner-admin-pat }}
        RUNNER_ID: ${{ inputs.runner-id }}
        REPO: ${{ github.repository }}
      run: '"$GITHUB_ACTION_PATH/remove.sh"'
